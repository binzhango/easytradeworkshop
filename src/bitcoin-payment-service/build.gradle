plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.53.0'
}

group = 'com.dynatrace.easytrade'
version = '1.0.0-easytrade'
java {
    java.sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-params:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.22.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.22.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-commons:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-engine:6.0.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Database
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.10.2.jre11'

    // Redis for caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'redis.clients:jedis:5.2.0'

    // Resilience4j for circuit breaker, retry, rate limiter
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    // OpenFeature for feature flags
    implementation 'dev.openfeature:sdk:1.20.1'

    // HTTP Client for blockchain API calls
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Security updates - not direct dependencies but need bumps to patch vulns
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.23'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.23'
    implementation 'ch.qos.logback:logback-core:1.5.36'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'tools.jackson.core:jackson-core:3.1.4'
    implementation 'tools.jackson.core:jackson-databind:3.1.5'
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml:3.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.6'
}

test {
    useJUnitPlatform()
}

def isNonStable = { String version ->
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  def regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version)
  }
}
