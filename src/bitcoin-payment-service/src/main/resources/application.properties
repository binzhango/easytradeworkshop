# Server Configuration
server.port=8080
spring.application.name=bitcoin-payment-service

# Database Configuration
spring.datasource.url=${MSSQL_CONNECTIONSTRING}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=BitcoinPaymentHikariCP

# Redis Cache Configuration
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=300000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.blockchainApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.blockchainApi.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.blockchainApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.blockchainApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.blockchainApi.permittedNumberOfCallsInHalfOpenState=3

# Retry Configuration
resilience4j.retry.instances.blockchainApi.maxAttempts=3
resilience4j.retry.instances.blockchainApi.waitDuration=1s
resilience4j.retry.instances.blockchainApi.enableExponentialBackoff=true
resilience4j.retry.instances.blockchainApi.exponentialBackoffMultiplier=2

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.blockchainApi.limitForPeriod=10
resilience4j.ratelimiter.instances.blockchainApi.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.blockchainApi.timeoutDuration=0s

# Feature Flag Configuration (OpenFeature)
feature.flag.service.url=${FEATURE_FLAG_SERVICE_URL:http://localhost:80/feature-flag-service}

# Blockchain API Configuration
blockchain.api.url=${BLOCKCHAIN_API_URL:https://api.blockcypher.com/v1/btc/main}
blockchain.api.token=${BLOCKCHAIN_API_TOKEN:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.dynatrace.easytrade.bitcoinpaymentservice=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# OpenAPI/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Actuator Configuration for Health Checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
