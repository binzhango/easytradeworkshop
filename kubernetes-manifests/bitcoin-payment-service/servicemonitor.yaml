apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitcoin-payment-service
  labels:
    app: bitcoin-payment-service
    component: payment
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: bitcoin-payment-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
