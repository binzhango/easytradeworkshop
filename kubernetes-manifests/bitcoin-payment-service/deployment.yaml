apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-payment-service
  labels:
    app: bitcoin-payment-service
    component: payment
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitcoin-payment-service
  template:
    metadata:
      labels:
        app: bitcoin-payment-service
        component: payment
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: bitcoin-payment-service
        image: easytrade/bitcoin-payment-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: MSSQL_CONNECTIONSTRING
          valueFrom:
            secretKeyRef:
              name: easytrade-db-credentials
              key: JAVA_CONNECTION_STRING
        - name: REDIS_HOST
          value: "easytrade-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: RABBITMQ_HOST
          value: "easytrade-rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          value: "guest"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easytrade-rabbitmq-credentials
              key: password
              optional: true
        - name: FEATURE_FLAG_SERVICE_URL
          value: "http://easytrade-feature-flag-service:8080"
        - name: BLOCKCHAIN_API_URL
          value: "https://api.blockcypher.com/v1/btc/main"
        - name: BLOCKCHAIN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: bitcoin-payment-secrets
              key: blockchain-api-token
              optional: true
        - name: MANIFEST_VERSION
          value: "1.0.0"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 3369
        fsGroup: 3369
